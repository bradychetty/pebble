[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pebble-lang"
version = "0.1.0"
description = "A small dynamically typed language with a tree-walking interpreter, written in Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pebble = "pebble.__main__:main"

[tool.setuptools]
packages = ["pebble"]
